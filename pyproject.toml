[project]
name = "support-api"
version = "0.1.0"
description = "Support ticket API with explicit authorization and confidential internal notes"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
