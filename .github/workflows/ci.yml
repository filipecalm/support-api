name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: support_test
          POSTGRES_USER: support_test
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support_test -d support_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://support_test:ci-ephemeral-only@127.0.0.1:5432/support_test
      SUPPORT_ALLOW_TEST_RESET: '1'
      ALLOWED_HOSTS: '["testserver","localhost","127.0.0.1"]'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m ruff check --config pyproject.toml app tests migrations
      - run: python -m ruff format --config pyproject.toml --check app tests migrations
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest -q
      - run: python -m bandit -r app -q
      - run: python -m pip_audit --progress-spinner off
      - run: python -m pip_audit -r requirements.txt --require-hashes --disable-pip --progress-spinner off
