services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - support-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      timeout: 3s
      retries: 10
  test-db:
    image: postgres:18.6
    profiles: [test]
    environment:
      POSTGRES_DB: support_test
      POSTGRES_USER: support_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55441:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_test -d support_test"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  support-data:
